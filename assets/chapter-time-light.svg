    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#0a0c2a" stroke-width="1.3" opacity=".5"/></pattern>
    <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="12" fill="#f0b400"/><rect x="6" width="6" height="12" fill="#0a0c2a"/></pattern>
    <pattern id="check" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#4a2cb8"/><rect x="8" y="8" width="8" height="8" fill="#4a2cb8"/><rect x="8" width="8" height="8" fill="#0a0c2a"/><rect y="8" width="8" height="8" fill="#0a0c2a"/></pattern>
