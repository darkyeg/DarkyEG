  <title>spinup: One command sets up every machine I code on, and keeps them all the same.</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#f4f1e6" stroke-width="1.3" opacity=".5"/></pattern>
    <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="12" fill="#f6c418"/><rect x="6" width="6" height="12" fill="#000000"/></pattern>
    <pattern id="check" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#8a63ff"/><rect x="8" y="8" width="8" height="8" fill="#8a63ff"/><rect x="8" width="8" height="8" fill="#000000"/><rect y="8" width="8" height="8" fill="#000000"/></pattern>
    <pattern id="hatchAccent" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#8a63ff" stroke-width="1.6"/></pattern>
    <pattern id="tone" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.05" fill="#c3c4e2" opacity=".45"/></pattern>
    <clipPath id="panel"><polygon points="1.5,1.5 383.5,1.5 383.5,162.5 1.5,162.5"/></clipPath>
    <style>
      .grow{transform-box:fill-box;transform-origin:left center;animation:growx .8s cubic-bezier(.2,.8,.2,1) backwards}
      .rise{transform-box:fill-box;transform-origin:center bottom;animation:growy .7s cubic-bezier(.2,.8,.2,1) backwards}
      .pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out backwards}
      .tremble{animation:tremble .22s steps(1) infinite}
      @keyframes growx{from{transform:scaleX(0)}}
      @keyframes growy{from{transform:scaleY(0)}}
      @keyframes pop{from{opacity:0;transform:scale(.3)}}
      @keyframes tremble{0%{transform:translate(0,0)}25%{transform:translate(1.4px,-1px)}50%{transform:translate(-1px,1.2px)}75%{transform:translate(-1.4px,-.8px)}}
      
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
