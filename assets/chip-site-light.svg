<svg xmlns="http://www.w3.org/2000/svg" width="189" height="64" viewBox="0 0 189 64" role="img" aria-label="darky.dev">
  <title>darky.dev</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#0a0c2a" stroke-width="1.3" opacity=".5"/></pattern>
    <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="12" fill="#f0b400"/><rect x="6" width="6" height="12" fill="#0a0c2a"/></pattern>
    <pattern id="check" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#4a2cb8"/><rect x="8" y="8" width="8" height="8" fill="#4a2cb8"/><rect x="8" width="8" height="8" fill="#0a0c2a"/><rect y="8" width="8" height="8" fill="#0a0c2a"/></pattern>
    <pattern id="hatchAccent" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#4a2cb8" stroke-width="1.6"/></pattern>
    <pattern id="tone" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.05" fill="#34355a" opacity=".45"/></pattern>
    <clipPath id="panel"><polygon points="1.5,1.5 167.5,1.5 167.5,42.5 1.5,42.5"/></clipPath>
    <style>
      .grow{transform-box:fill-box;transform-origin:left center;animation:growx .8s cubic-bezier(.2,.8,.2,1) backwards}
      .rise{transform-box:fill-box;transform-origin:center bottom;animation:growy .7s cubic-bezier(.2,.8,.2,1) backwards}
      .pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out backwards}
      .tremble{animation:tremble .22s steps(1) infinite}
      @keyframes growx{from{transform:scaleX(0)}}
      @keyframes growy{from{transform:scaleY(0)}}
      @keyframes pop{from{opacity:0;transform:scale(.3)}}
      @keyframes tremble{0%{transform:translate(0,0)}25%{transform:translate(1.4px,-1px)}50%{transform:translate(-1px,1.2px)}75%{transform:translate(-1.4px,-.8px)}}
      
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g transform="translate(10 10)">
    
    <g>
    
  <rect x="4" y="4" width="165" height="40" fill="#4a2cb8"/>
  <rect x="0" y="0" width="165" height="40" fill="#f0b400" stroke="#0a0c2a" stroke-width="2.5"/>
  <text x="20" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#05061a" text-anchor="start" textLength="95" lengthAdjust="spacing">darky.dev</text>
  <polygon transform="translate(131 12)" points="0,7 14,7 14,2 24,10 14,18 14,13 0,13" fill="#05061a"/>
    </g>
    
  </g>
</svg>
